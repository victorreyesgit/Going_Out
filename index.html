<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Going Out Web</title>
    <style>
        body {
            font-family: sans-serif;
        }
        
        .drink-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            margin-top: 20px;
        }
        .counter {
            text-align: center;
        }
        img {
            width: 150px;  /* más grande */
            height: 150px;
            cursor: pointer;
        }
        #messages {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: red;
            font-size: 1.5em; /* más grande para el hangover */
        }
        #beer-times {
            text-align: center;
            margin-top: 10px;
        }
        #beer-times span {
            display: inline-block;
            margin: 0 5px;
            font-weight: normal;
        }
        #max-beers-container {
            margin-top: 10px;
            text-align: center;
            font-size: 1.1em;
        }
        #max-beers {
            font-size: 1.1em;
            cursor: pointer;
        }
        #reset-container {
            text-align: center;
            margin-top: 25px;
        }
        #reset-btn {
            font-size: 1.1em;
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            background: #c0392b;
            color: white;
            cursor: pointer;
        }
        #page-title {
            text-align: center;      /* center it horizontally */
            font-size: 3em;          /* make it bigger */
            color: #ff8800;          /* orange-ish for fun */
            text-shadow: 2px 2px #444; /* subtle shadow for pop */
            margin-top: 20px;
        }

    </style>
</head>
<body>
    <h1 id="page-title">Going Out Web</h1>

    <div id="max-beers-container">
        Set maximum beers allowed: 
        <select id="max-beers"></select>
    </div>

    <div class="drink-container">
        <div class="counter">
            <h3>Beer: <span id="beer-count">0</span></h3>
            <img src="boring_beer.png" alt="Beer" onclick="addDrink('beer')">
        </div>

        <div class="counter">
            <h3>Water: <span id="water-count">0</span></h3>
            <img src="water.png" alt="Water" onclick="addDrink('water')">
        </div>
    </div>

    <div id="messages"></div>
    <div id="beer-times">
        <h4>Beer consumption:</h4>
        <div id="beer-times-list"></div>
    </div>

    <div id="reset-container">
        <button id="reset-btn" onclick="resetAll()">Reset</button>
    </div>

    <script>
        const STORAGE_KEY = 'goingOutState';

        // Generar opciones max beers dinámicamente
        const select = document.getElementById('max-beers');
        for (let i = 1; i <= 20; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = i;
            if (i === 3) option.selected = true; // valor predeterminado
            select.appendChild(option);
        }

        let counts = { beer: 0, water: 0 };
        let beerTimes = [];   // timestamps (ms) of each beer
        let lastDrink = null;

        // ---- Save / load (localStorage survives the phone reloading the page) ----
        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    counts, beerTimes, lastDrink, maxBeers: select.value
                }));
            } catch (e) { /* storage unavailable: app still works, just without memory */ }
        }

        function loadState() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (!saved) return;
                counts = saved.counts || counts;
                beerTimes = saved.beerTimes || [];
                lastDrink = saved.lastDrink || null;
                if (saved.maxBeers) select.value = saved.maxBeers;
            } catch (e) { /* corrupted data: start fresh */ }
        }

        function render() {
            document.getElementById('beer-count').textContent = counts.beer;
            document.getElementById('water-count').textContent = counts.water;
            checkMessages(lastDrink);
            updateBeerTimes();
        }

        function addDrink(type) {
            counts[type] += 1;
            lastDrink = type;
            if (type === 'beer') beerTimes.push(Date.now());
            saveState();
            render();
        }

        function resetAll() {
            if (!confirm('Reset all counts?')) return;
            counts = { beer: 0, water: 0 };
            beerTimes = [];
            lastDrink = null;
            saveState();   // keeps the max-beers setting
            render();
        }

        select.addEventListener('change', () => { saveState(); render(); });

        function checkMessages(lastDrink) {
            const messages = [];
            const maxBeers = parseInt(select.value);

            // Hangover aparece si sobrepasas max beers
            if (counts.beer > maxBeers) {
                messages.push("🎉 YOU HAVE UNLOCKED HANGOVER TOMORROW 🎉");
            } else if (lastDrink === 'beer' && counts.water < counts.beer) {
                messages.push("💧 Drink water, drunkass 💧");
            }

            document.getElementById('messages').innerHTML = messages.join('<br>');
        }

        function updateBeerTimes() {
            const container = document.getElementById('beer-times-list');
            container.innerHTML = '';

            beerTimes.forEach((time, index) => {
                const span = document.createElement('span');

                if (index === 0) {
                    const d = new Date(time);
                    span.textContent = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                } else {
                    const interval = Math.round((time - beerTimes[index - 1]) / 60000);
                    span.textContent = `+${interval}'`;
                }

                container.appendChild(span);
            });
        }

        loadState();
        render();
    </script>
</body>
</html>
