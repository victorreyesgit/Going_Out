<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Going Out Web</title>
    <style>
        body {
            font-family: sans-serif;
        }
        
        .drink-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            margin-top: 20px;
        }
        .counter {
            text-align: center;
        }
        img {
            width: 150px;  /* más grande */
            height: 150px;
            cursor: pointer;
        }
        #messages {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: red;
            font-size: 1.5em; /* más grande para el hangover */
        }
        #beer-times {
            text-align: center;
            margin-top: 10px;
        }
        #beer-times span {
            display: inline-block;
            margin: 0 5px;
            font-weight: normal;
        }
        #max-beers-container {
            margin-top: 10px;
            text-align: center;
            font-size: 1.1em;
        }
        #max-beers {
            font-size: 1.1em;
            cursor: pointer;
        }
        #page-title {
            text-align: center;      /* center it horizontally */
            font-size: 3em;          /* make it bigger */
            color: #ff8800;          /* orange-ish for fun */
            text-shadow: 2px 2px #444; /* subtle shadow for pop */
            margin-top: 20px;
        }

    </style>
</head>
<body>
    <h1 id="page-title">Going Out Web</h1>

    <div id="max-beers-container">
        Set maximum beers allowed: 
        <select id="max-beers"></select>
    </div>

    <div class="drink-container">
        <div class="counter">
            <h3>Beer: <span id="beer-count">0</span></h3>
            <img src="boring_beer.png" alt="Beer" onclick="addDrink('beer')">
        </div>

        <div class="counter">
            <h3>Water: <span id="water-count">0</span></h3>
            <img src="water.png" alt="Water" onclick="addDrink('water')">
        </div>
    </div>

    <div id="messages"></div>
    <div id="beer-times">
        <h4>Beer consumption:</h4>
        <div id="beer-times-list"></div>
    </div>

    <script>
        // Generar opciones max beers dinámicamente
        const select = document.getElementById('max-beers');
        for (let i = 1; i <= 20; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = i;
            if (i === 3) option.selected = true; // valor predeterminado
            select.appendChild(option);
        }

        let counts = { beer: 0, water: 0 };
        let beerTimes = [];

        function addDrink(type) {
            counts[type] += 1;
            document.getElementById(type + '-count').textContent = counts[type];

            checkMessages(type);

            if (type === 'beer') {
                const now = new Date();
                const minutes = now.getHours() * 60 + now.getMinutes();
                beerTimes.push(minutes);
                updateBeerTimes();
            }
        }

        function checkMessages(lastDrink) {
            const messages = [];
            const maxBeers = parseInt(document.getElementById('max-beers').value);

            // Hangover aparece si sobrepasas max beers
            if (counts.beer > maxBeers) {
                messages.push("🎉 YOU HAVE UNLOCKED HANGOVER TOMORROW 🎉");
            } else if (lastDrink === 'beer' && counts.water < counts.beer) {
                messages.push("💧 Drink water, drunkass 💧");
            }

            document.getElementById('messages').innerHTML = messages.join('<br>');
        }

        function updateBeerTimes() {
            const container = document.getElementById('beer-times-list');
            container.innerHTML = '';

            beerTimes.forEach((time, index) => {
                const span = document.createElement('span');

                if (index === 0) {
                    const hours = Math.floor(time / 60);
                    const mins = time % 60;
                    span.textContent = `${hours.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}`;
                } else {
                    const interval = time - beerTimes[index - 1];
                    span.textContent = `+${interval}'`;
                }

                container.appendChild(span);
            });
        }
    </script>
</body>
</html>
