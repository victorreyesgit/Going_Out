<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Going Out</title>
    <style>
        body {
            font-family: sans-serif;
        }
        .drink-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            margin-top: 20px;
        }
        .counter {
            text-align: center;
        }
        img {
            width: 100px;
            height: 100px;
            cursor: pointer;
        }
        #messages {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: red;
        }
        #beer-times {
            text-align: center;
            margin-top: 10px;
        }
        #beer-times span {
            display: inline-block;
            margin: 0 5px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Going Out Web</h1>

    <p>Set maximum beers allowed:</p>
    <select id="max-beers"></select>

    <div class="drink-container">
        <div class="counter">
            <h3>Beer: <span id="beer-count">0</span></h3>
            <img src="beer.jpg" alt="Beer" onclick="addDrink('beer')">
        </div>

        <div class="counter">
            <h3>Water: <span id="water-count">0</span></h3>
            <img src="water.webp" alt="Water" onclick="addDrink('water')">
        </div>
    </div>

    <div id="messages"></div>
    <div id="beer-times">
        <h4>Beer consumption:</h4>
        <div id="beer-times-list"></div>
    </div>

    <script>
        // Dynamically generate max beers options 
        const select = document.getElementById('max-beers');
        for (let i = 1; i <= 10; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = i;
            select.appendChild(option);
            if (i === 3) option.selected = true; // default value
                select.appendChild(option);
        }

        // Counters
        let counts = { beer: 0, water: 0 };
        let beerTimes = []; // minutes since midnight

        function addDrink(type) {
            counts[type] += 1;
            document.getElementById(type + '-count').textContent = counts[type];

            checkMessages(type);

            if (type === 'beer') {
                const now = new Date();
                const minutes = now.getHours() * 60 + now.getMinutes(); 
                beerTimes.push(minutes);

                updateBeerTimes();
            }
        }

        function checkMessages(lastDrink) {
            const messages = [];
            const maxBeers = parseInt(document.getElementById('max-beers').value);

            if (lastDrink === 'beer' && counts.water < counts.beer) {
                messages.push("Drink water, drunkass");
            }

            if (counts.beer > maxBeers) {
                messages.push("YOU HAVE UNLOCKED HANGOVER TOMORROW");
            }

            document.getElementById('messages').innerHTML = messages.join('<br>');
        }

        function updateBeerTimes() {
            const container = document.getElementById('beer-times-list');
            container.innerHTML = ''; // clear previous

            beerTimes.forEach((time, index) => {
                const span = document.createElement('span');

                if (index === 0) {
                    // First beer: show HH:MM
                    const hours = Math.floor(time / 60);
                    const mins = time % 60;
                    span.textContent = `${hours.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}`;
                } else {
                    // Subsequent beers: show interval from previous beer
                    const interval = time - beerTimes[index - 1];
                    span.textContent = `+${interval}'`;
                }

                container.appendChild(span);
            });
        }
    </script>
</body>
</html>
